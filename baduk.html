<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>바둑 - 핸드폰 최적화</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
  background: #0c1a12; color: #f8fafc;
  touch-action: manipulation;
}
.app { display: flex; flex-direction: column; height: 100dvh; }
.header {
  flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: rgba(15,36,25,0.95); border-bottom: 1px solid #2d5a3d;
}
.screen { flex: 1; display: none; flex-direction: column; align-items: center; padding: 12px; gap: 10px; overflow-y: auto; }
.screen.active { display: flex; }
.rooms { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; }
.room-btn {
  background: linear-gradient(145deg, #14532d, #166534); border: 1px solid #4ade80;
  color: white; padding: 18px; border-radius: 14px; font-size: 1.1em; font-weight: 600;
  min-height: 56px; cursor: pointer;
}
.board-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
canvas { max-width: 100%; max-height: 100%; background: #d4a574; border-radius: 8px; touch-action: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.controls { flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px; width: 100%; }
button {
  background: #166534; color: white; border: none; padding: 12px 16px; border-radius: 10px;
  font-weight: 600; min-height: 48px; cursor: pointer;
}
.status { text-align: center; font-weight: 600; padding: 6px; font-size: 1.05em; }
.thinking { color: #fbbf24; }
.log { background: rgba(15,36,25,0.7); padding: 8px; border-radius: 8px; max-height: 70px; overflow-y: auto; width: 100%; font-size: 0.8em; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><strong>바둑</strong><br><small style="opacity:0.7">핸드폰용</small></div>
    <div>흑: <span id="blackCount">0</span> | 백: <span id="whiteCount">0</span></div>
  </div>

  <div class="screen active" id="lobby">
    <h2 style="text-align:center;">판 크기 선택</h2>
    <div class="rooms">
      <button class="room-btn" onclick="startGame(9)">9×9 (초급)</button>
      <button class="room-btn" onclick="startGame(13)">13×13 (중급)</button>
      <button class="room-btn" onclick="startGame(19)">19×19 (정식)</button>
    </div>
    <p style="text-align:center; opacity:0.8; margin-top:8px;">간단한 바둑 (포획 기본 지원)</p>
    <button onclick="location.href='index.html'" style="margin-top:12px; background:#854d0e;">오목으로 이동</button>
  </div>

  <div class="screen" id="gameScreen">
    <div class="status" id="status">흑 차례</div>
    <div class="board-container">
      <canvas id="board"></canvas>
    </div>
    <div class="controls">
      <button onclick="pass()">패스</button>
      <button onclick="undo()">무르기</button>
      <button onclick="showLobby()">로비</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
let size = 9, cell = 32, margin = 20;
let board = [], currentPlayer = 1, history = [], gameOver = false;
let canvas, ctx, lastMove = null;
let blackCaptures = 0, whiteCaptures = 0;

function resizeBoard() {
  if (!canvas) return;
  const container = document.querySelector('.board-container');
  const avail = Math.min(container.clientWidth - 16, container.clientHeight - 16, window.innerWidth - 24);
  cell = Math.max(14, Math.min(28, Math.floor((avail - margin*2) / (size - 1))));
  const dim = margin*2 + cell*(size-1);
  canvas.width = dim; canvas.height = dim;
  canvas.style.width = dim + 'px'; canvas.style.height = dim + 'px';
  draw();
}

function initBoard(s) {
  size = s;
  canvas = document.getElementById('board');
  board = Array.from({length:size}, () => Array(size).fill(0));
  history = []; currentPlayer = 1; gameOver = false; lastMove = null;
  blackCaptures = whiteCaptures = 0;
  updateCounts();
  resizeBoard();
  canvas.onclick = onClick;
  canvas.ontouchstart = e => { e.preventDefault(); onClick(e.touches[0]); };
  window.addEventListener('resize', resizeBoard);
}

function draw() {
  if (!ctx) ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#d4a574';
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#5c3a21';
  ctx.lineWidth = Math.max(1, cell*0.025);
  for (let i=0; i<size; i++) {
    const p = margin + i*cell;
    ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(margin+(size-1)*cell, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, margin+(size-1)*cell); ctx.stroke();
  }
  if (size >= 13) {
    const pts = size===19 ? [3,9,15] : [3,6,9];
    ctx.fillStyle = '#3f2a1d';
    pts.forEach(r => pts.forEach(c => {
      if (r < size && c < size) {
        ctx.beginPath();
        ctx.arc(margin+c*cell, margin+r*cell, Math.max(2, cell*0.07), 0, Math.PI*2);
        ctx.fill();
      }
    }));
  }
  for (let r=0; r<size; r++) for (let c=0; c<size; c++) if (board[r][c]) drawStone(c,r,board[r][c]);
  if (lastMove) {
    const [lr,lc] = lastMove;
    ctx.beginPath();
    ctx.arc(margin+lc*cell, margin+lr*cell, cell*0.38, 0, Math.PI*2);
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = Math.max(2, cell*0.07);
    ctx.stroke();
  }
}

function drawStone(c, r, p) {
  const x = margin + c*cell, y = margin + r*cell, rad = cell*0.42;
  ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
  if (p===1) {
    const gr = ctx.createRadialGradient(x-rad*0.3,y-rad*0.3,0,x,y,rad);
    gr.addColorStop(0,'#555'); gr.addColorStop(1,'#111');
    ctx.fillStyle = gr;
  } else {
    const gr = ctx.createRadialGradient(x-rad*0.3,y-rad*0.3,0,x,y,rad);
    gr.addColorStop(0,'#fff'); gr.addColorStop(1,'#ddd');
    ctx.fillStyle = gr;
  }
  ctx.fill();
  ctx.strokeStyle = p===1 ? '#000' : '#999';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const x = ((e.clientX||e.pageX) - rect.left) * scaleX;
  const y = ((e.clientY||e.pageY) - rect.top) * scaleY;
  const c = Math.round((x - margin) / cell);
  const r = Math.round((y - margin) / cell);
  if (r>=0 && r<size && c>=0 && c<size) return [r,c];
  return null;
}

function onClick(e) {
  if (gameOver) return;
  const pos = posFromEvent(e);
  if (!pos || board[pos[0]][pos[1]]) return;
  if (tryPlace(pos[0], pos[1], currentPlayer)) {
    lastMove = [pos[0], pos[1]];
    history.push(JSON.parse(JSON.stringify(board)));
    currentPlayer = 3 - currentPlayer;
    setStatus((currentPlayer===1?'흑':'백') + ' 차례');
    draw();
    updateCounts();
  }
}

function tryPlace(r, c, p) {
  board[r][c] = p;
  const opp = 3 - p;
  let captured = false;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    const nr = r+dr, nc = c+dc;
    if (nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc]===opp) {
      if (!hasLiberty(nr, nc, opp)) {
        captureGroup(nr, nc, opp);
        captured = true;
      }
    }
  }
  if (!captured && !hasLiberty(r, c, p)) {
    board[r][c] = 0;
    return false;
  }
  return true;
}

function hasLiberty(r, c, p, visited = new Set()) {
  const key = r+','+c;
  if (visited.has(key)) return false;
  visited.add(key);
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    const nr = r+dr, nc = c+dc;
    if (nr<0||nr>=size||nc<0||nc>=size) continue;
    if (board[nr][nc]===0) return true;
    if (board[nr][nc]===p && hasLiberty(nr, nc, p, visited)) return true;
  }
  return false;
}

function captureGroup(r, c, p, visited = new Set()) {
  const key = r+','+c;
  if (visited.has(key) || board[r][c]!==p) return;
  visited.add(key);
  board[r][c] = 0;
  if (p===1) whiteCaptures++; else blackCaptures++;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of dirs) {
    const nr = r+dr, nc = c+dc;
    if (nr>=0 && nr<size && nc>=0 && nc<size) captureGroup(nr, nc, p, visited);
  }
}

function updateCounts() {
  document.getElementById('blackCount').textContent = blackCaptures;
  document.getElementById('whiteCount').textContent = whiteCaptures;
}
function setStatus(t) { document.getElementById('status').textContent = t; }
function log(t) {
  const el = document.getElementById('log');
  el.innerHTML = `<div>${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} ${t}</div>` + el.innerHTML;
}
function pass() {
  if (gameOver) return;
  log((currentPlayer===1?'흑':'백') + ' 패스');
  currentPlayer = 3 - currentPlayer;
  setStatus((currentPlayer===1?'흑':'백') + ' 차례');
}
function undo() {
  if (history.length < 1) return;
  history.pop();
  if (history.length) board = JSON.parse(JSON.stringify(history[history.length-1]));
  else board = Array.from({length:size}, () => Array(size).fill(0));
  currentPlayer = 3 - currentPlayer;
  lastMove = null;
  draw();
  setStatus('무르기');
}
function showLobby() {
  document.getElementById('lobby').classList.add('active');
  document.getElementById('gameScreen').classList.remove('active');
}
function startGame(s) {
  document.getElementById('lobby').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  initBoard(s);
  setStatus('흑 차례');
  log(s+'×'+s+' 시작');
}
</script>
</body>
</html>
