<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>명품 오목 - 핸드폰 최적화</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap');
:root {
  --bg: #0c1a12;
  --gold: #d4af37;
  --green: #22c55e;
  --wood: #c9956b;
  --text: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
  background: radial-gradient(circle at top, #1a3a2a, #0c1a12);
  color: var(--text);
  touch-action: manipulation;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.header {
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(15,36,25,0.95);
  border-bottom: 1px solid #2d5a3d;
  font-size: 0.95em;
}
.rank-badge {
  background: linear-gradient(90deg, #a16207, #d4af37);
  color: #1a1a1a;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.9em;
}
.screen {
  flex: 1;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-y: auto;
  padding: 12px;
  gap: 12px;
}
.screen.active { display: flex; }
.rooms {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
}
.room-btn {
  background: linear-gradient(145deg, #14532d, #166534);
  border: 1px solid #4ade80;
  color: white;
  padding: 18px 16px;
  border-radius: 14px;
  font-size: 1.1em;
  font-weight: 600;
  cursor: pointer;
  min-height: 56px;
  touch-action: manipulation;
}
.board-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 0;
}
canvas {
  max-width: 100%;
  max-height: 100%;
  background: #c9956b;
  border-radius: 8px;
  touch-action: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.controls {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 8px;
  width: 100%;
}
button {
  background: #166534;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 1em;
  min-height: 48px;
  min-width: 70px;
  cursor: pointer;
  touch-action: manipulation;
}
.status {
  text-align: center;
  font-weight: 600;
  padding: 8px;
  font-size: 1.1em;
  min-height: 1.4em;
}
.thinking { color: #fbbf24; }
.slider-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9em;
  width: 100%;
  justify-content: center;
}
input[type=range] { width: 140px; height: 28px; }
.log {
  background: rgba(15,36,25,0.7);
  padding: 8px;
  border-radius: 8px;
  max-height: 80px;
  overflow-y: auto;
  width: 100%;
  font-size: 0.8em;
}
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal.show { display: flex; }
.modal-content {
  background: #1a3a2a;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  border: 2px solid #d4af37;
  max-width: 90%;
  width: 340px;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <strong>전국 오목</strong><br>
      <small style="opacity:0.7">핸드폰 최적화</small>
    </div>
    <div class="rank-badge" id="rankDisplay">초급 15급</div>
    <div style="text-align:right">점수<br><strong id="scoreDisplay">0</strong></div>
  </div>

  <div class="screen active" id="lobby">
    <h2 style="text-align:center; margin:8px 0;">대국 선택</h2>
    <div class="rooms">
      <button class="room-btn" onclick="startGame(9,'easy')">초급 방<br><small>9×9 · 로봇 A</small></button>
      <button class="room-btn" onclick="startGame(13,'medium')">중급 방<br><small>13×13 · 로봇 A/B</small></button>
      <button class="room-btn" onclick="startGame(15,'hard')">전국대회<br><small>15×15 · 로봇 B</small></button>
    </div>
    <p style="text-align:center; opacity:0.8; margin-top:8px; font-size:0.95em;">
      로봇은 한 수씩만 둡니다.<br>핸드폰에서도 편하게 플레이하세요.
    </p>
    <button onclick="location.href='baduk.html'" style="margin-top:12px; background:#854d0e;">바둑으로 이동</button>
  </div>

  <div class="screen" id="gameScreen">
    <div class="status" id="status">흑(당신) 차례</div>
    <div class="board-container">
      <canvas id="board"></canvas>
    </div>
    <div class="controls">
      <button onclick="undo()">무르기</button>
      <button onclick="resign()">기권</button>
      <button onclick="showLobby()">로비</button>
    </div>
    <div class="slider-wrap">
      AI 속도: <input type="range" id="speed" min="800" max="4000" value="1800" step="200">
      <span id="speedLabel">1.8초</span>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="modal-content">
    <h2 id="resultTitle">승리!</h2>
    <p id="resultMsg" style="margin:12px 0;"></p>
    <p>등급: <strong id="newRank" style="color:#d4af37"></strong></p>
    <div style="margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
      <button onclick="closeModal(); showLobby();">로비</button>
      <button onclick="closeModal(); startGame(currentSize, currentDiff);">다시</button>
    </div>
  </div>
</div>

<script>
const RANKS = [
  {name:"초급 18급", min:0}, {name:"초급 15급", min:40}, {name:"초급 12급", min:100},
  {name:"초급 9급", min:180}, {name:"초급 6급", min:280}, {name:"초급 3급", min:400},
  {name:"중급 1급", min:540}, {name:"1단", min:720}, {name:"2단", min:920},
  {name:"3단", min:1150}, {name:"4단", min:1450}, {name:"5단+", min:1800}
];
let playerScore = parseInt(localStorage.getItem('omokPremiumScore') || '0');
let currentSize = 15, currentDiff = 'medium';
let board = [], size = 15, cell = 36, margin = 20;
let currentPlayer = 1, gameOver = false, history = [];
let aiDelay = 1800, aiThinking = false, aiTimeoutId = null;
let lastMove = null, winLine = null;
let canvas, ctx;

function getRank(s) {
  let r = RANKS[0];
  for (let i = RANKS.length-1; i>=0; i--) if (s >= RANKS[i].min) { r = RANKS[i]; break; }
  return r;
}
function updateRankUI() {
  const r = getRank(playerScore);
  document.getElementById('rankDisplay').textContent = r.name;
  document.getElementById('scoreDisplay').textContent = playerScore;
}
updateRankUI();

function resizeBoard() {
  if (!canvas) return;
  const container = document.querySelector('.board-container');
  if (!container) return;
  const avail = Math.min(container.clientWidth - 16, container.clientHeight - 16, window.innerWidth - 24);
  const maxCell = Math.floor((avail - margin*2) / (size - 1));
  cell = Math.max(18, Math.min(36, maxCell));
  const dim = margin*2 + cell*(size-1);
  canvas.width = dim;
  canvas.height = dim;
  canvas.style.width = dim + 'px';
  canvas.style.height = dim + 'px';
  draw();
}

function initBoard(s) {
  size = s;
  canvas = document.getElementById('board');
  board = Array.from({length:size}, () => Array(size).fill(0));
  history = []; lastMove = null; winLine = null;
  currentPlayer = 1; gameOver = false; aiThinking = false;
  if (aiTimeoutId) clearTimeout(aiTimeoutId);
  resizeBoard();
  canvas.onclick = onClick;
  canvas.ontouchstart = e => { e.preventDefault(); onClick(e.touches[0]); };
  window.addEventListener('resize', resizeBoard);
  window.addEventListener('orientationchange', () => setTimeout(resizeBoard, 300));
}

function draw() {
  if (!ctx) ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const g = ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#d4a574'); g.addColorStop(1,'#b07d4a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#5c3a21';
  ctx.lineWidth = Math.max(1, cell*0.03);
  for (let i=0; i<size; i++) {
    const p = margin + i*cell;
    ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(margin+(size-1)*cell, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, margin+(size-1)*cell); ctx.stroke();
  }
  const stars = size>=15 ? [3,7,11] : size>=13 ? [3,6,9] : [2,4,6];
  ctx.fillStyle = '#3f2a1d';
  stars.forEach(r => stars.forEach(c => {
    if (r < size && c < size) {
      ctx.beginPath();
      ctx.arc(margin+c*cell, margin+r*cell, Math.max(2, cell*0.08), 0, Math.PI*2);
      ctx.fill();
    }
  }));
  for (let r=0; r<size; r++) for (let c=0; c<size; c++) if (board[r][c]) drawStone(c,r,board[r][c]);
  if (lastMove && !winLine) {
    const [lr,lc] = lastMove;
    ctx.beginPath();
    ctx.arc(margin+lc*cell, margin+lr*cell, cell*0.4, 0, Math.PI*2);
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = Math.max(2, cell*0.08);
    ctx.stroke();
  }
  if (winLine) {
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = Math.max(3, cell*0.12);
    ctx.lineCap = 'round';
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    winLine.forEach(([r,c],i) => {
      const x = margin+c*cell, y = margin+r*cell;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawStone(c, r, p) {
  const x = margin + c*cell, y = margin + r*cell, rad = cell*0.42;
  ctx.beginPath();
  ctx.arc(x,y,rad,0,Math.PI*2);
  if (p===1) {
    const gr = ctx.createRadialGradient(x-rad*0.35,y-rad*0.35,0,x,y,rad);
    gr.addColorStop(0,'#666'); gr.addColorStop(1,'#111');
    ctx.fillStyle = gr;
  } else {
    const gr = ctx.createRadialGradient(x-rad*0.35,y-rad*0.35,0,x,y,rad);
    gr.addColorStop(0,'#fff'); gr.addColorStop(0.6,'#f0f0f0'); gr.addColorStop(1,'#ccc');
    ctx.fillStyle = gr;
  }
  ctx.fill();
  ctx.strokeStyle = p===1 ? '#000' : '#999';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  const x = ((e.clientX||e.pageX) - rect.left) * scaleX;
  const y = ((e.clientY||e.pageY) - rect.top) * scaleY;
  const c = Math.round((x - margin) / cell);
  const r = Math.round((y - margin) / cell);
  if (r>=0 && r<size && c>=0 && c<size) return [r,c];
  return null;
}

function onClick(e) {
  if (gameOver || currentPlayer !== 1 || aiThinking) return;
  const pos = posFromEvent(e);
  if (!pos || board[pos[0]][pos[1]]) return;
  place(pos[0], pos[1], 1);
  if (!gameOver) {
    currentPlayer = 2;
    aiThinking = true;
    setStatus('로봇 생각 중...', true);
    if (aiTimeoutId) clearTimeout(aiTimeoutId);
    aiTimeoutId = setTimeout(aiMove, aiDelay);
  }
}

function place(r, c, p) {
  board[r][c] = p;
  history.push([r,c,p]);
  lastMove = [r,c];
  draw();
  const line = getWinLine(r,c,p);
  if (line) {
    winLine = line;
    draw();
    endGame(p===1 ? 'win' : 'lose');
    return;
  }
  if (history.length >= size*size) endGame('draw');
}

function getWinLine(r, c, p) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr,dc] of dirs) {
    let cells = [[r,c]];
    for (let d=1; d<5; d++) {
      const nr=r+dr*d, nc=c+dc*d;
      if (nr<0||nr>=size||nc<0||nc>=size||board[nr][nc]!==p) break;
      cells.push([nr,nc]);
    }
    for (let d=1; d<5; d++) {
      const nr=r-dr*d, nc=c-dc*d;
      if (nr<0||nr>=size||nc<0||nc>=size||board[nr][nc]!==p) break;
      cells.unshift([nr,nc]);
    }
    if (cells.length >= 5) return cells.slice(0,5);
  }
  return null;
}

function aiMove() {
  aiThinking = false;
  aiTimeoutId = null;
  if (gameOver || currentPlayer !== 2) return;
  const moves = getCandidates();
  if (!moves.length) return;
  let best = null;
  for (const [r,c] of moves) {
    board[r][c]=2;
    if (getWinLine(r,c,2)) { best=[r,c]; board[r][c]=0; break; }
    board[r][c]=0;
  }
  if (!best) {
    for (const [r,c] of moves) {
      board[r][c]=1;
      if (getWinLine(r,c,1)) { best=[r,c]; board[r][c]=0; break; }
      board[r][c]=0;
    }
  }
  if (!best) best = moves[Math.floor(Math.random()*Math.min(moves.length, currentDiff==='hard'?6:10))];
  place(best[0], best[1], 2);
  log('로봇 한 수 둠');
  if (!gameOver) {
    currentPlayer = 1;
    setStatus('흑 차례');
  }
}

function getCandidates() {
  const set = new Set();
  const range = currentDiff==='hard' ? 2 : 1;
  let has = false;
  for (let r=0;r<size;r++) for (let c=0;c<size;c++) if (board[r][c]) {
    has = true;
    for (let dr=-range;dr<=range;dr++) for (let dc=-range;dc<=range;dc++) {
      const nr=r+dr, nc=c+dc;
      if (nr>=0&&nr<size&&nc>=0&&nc<size&&!board[nr][nc]) set.add(nr+','+nc);
    }
  }
  if (!has) set.add(Math.floor(size/2)+','+Math.floor(size/2));
  return [...set].map(s=>s.split(',').map(Number));
}

function endGame(result) {
  gameOver = true;
  aiThinking = false;
  let delta = 0, msg = '';
  if (result==='win') {
    delta = currentDiff==='easy'?30:currentDiff==='medium'?50:70;
    msg = `승리! +${delta}점`;
    setStatus('승리!');
  } else if (result==='lose') {
    delta = currentDiff==='easy'?-8:currentDiff==='medium'?-18:-28;
    msg = `패배 ${delta}점`;
    setStatus('패배');
  } else {
    msg = '무승부';
    setStatus('무승부');
  }
  playerScore = Math.max(0, playerScore + delta);
  localStorage.setItem('omokPremiumScore', playerScore);
  updateRankUI();
  document.getElementById('resultTitle').textContent = result==='win'?'승리!':result==='lose'?'패배':'무승부';
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('newRank').textContent = getRank(playerScore).name;
  document.getElementById('resultModal').classList.add('show');
  log(msg);
}

function setStatus(text, thinking=false) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (thinking?' thinking':'');
}
function log(t) {
  const el = document.getElementById('log');
  el.innerHTML = `<div>${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} ${t}</div>` + el.innerHTML;
}
function undo() {
  if (history.length < 2 || gameOver || aiThinking) return;
  for (let i=0; i<2 && history.length; i++) {
    const [r,c] = history.pop();
    board[r][c] = 0;
  }
  lastMove = history.length ? history[history.length-1].slice(0,2) : null;
  winLine = null;
  currentPlayer = 1;
  draw();
  setStatus('무르기 완료');
}
function resign() { if (!gameOver) endGame('lose'); }
function showLobby() {
  document.getElementById('lobby').classList.add('active');
  document.getElementById('gameScreen').classList.remove('active');
}
function startGame(s, diff) {
  currentSize = s; currentDiff = diff;
  document.getElementById('lobby').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  initBoard(s);
  setStatus('흑 차례');
  log(`${s}×${s} 시작`);
}
function closeModal() { document.getElementById('resultModal').classList.remove('show'); }
document.getElementById('speed').oninput = e => {
  aiDelay = +e.target.value;
  document.getElementById('speedLabel').textContent = (aiDelay/1000).toFixed(1)+'초';
};
</script>
</body>
</html>
